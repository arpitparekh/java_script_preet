<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        background-color: lightcoral;
      }
      aside {
        width: 15%;
        background-color: lightcyan;
        padding: 20px;
        box-sizing: border-box;
        height: 100vh;
      }
      main {
        width: 85%;
        padding: 20px;
        background-color: lightblue;
        box-sizing: border-box;
        height: 100vh;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <aside>
      <h2>Pages</h2>
      <ul>
        <li><a href="" id="li1">Section 1</a></li>
        <li><a href="" id="li2">Section 2</a></li>
        <li><a href="" id="li3">Section 3</a></li>
      </ul>
    </aside>

    <main>
      <h2>Main Content</h2>

      <div id="mainContent"></div>
    </main>

    <script>
      let l1 = document.getElementById('li1');
      let l2 = document.getElementById('li2');
      let l3 = document.getElementById('li3');

      let divMain = document.getElementById('mainContent');

      l1.addEventListener('click', (e) => {
        e.preventDefault(); // stop the page from refreshing
        loadPage('events.html');
      });

      l2.addEventListener('click', (e) => {
        e.preventDefault(); // stop the page from refreshing
        loadPage('banking_system.html');
      });

      l3.addEventListener('click', (e) => {
        e.preventDefault(); // stop the page from refreshing
        loadPage('boxes.html');
      });

      function loadPage(page) {
        fetch(page)
          .then((response) => response.text())
          .then((data) => {
            divMain.innerHTML = data;
            console.log(data);

            let b = document.getElementById('openAccount');
            let div = document.getElementById('content');
            div.style.padding = '20px';

            b.addEventListener('click', function () {
              div.innerHTML = '';
              createForm();
            });

            function createForm() {
              let form = document.createElement('form');
              form.style.display = 'flex';
              form.style.flexDirection = 'column';

              let name = document.createElement('label');
              name.innerHTML = 'Name';
              let nameInput = document.createElement('input');
              nameInput.type = 'text';
              nameInput.placeholder = 'Enter Name';
              nameInput.style.width = '300px';
              nameInput.style.marginTop = '5px';
              nameInput.style.marginBottom = '10px';

              let address = document.createElement('label');
              address.innerHTML = 'Address';
              let addressInput = document.createElement('input');
              addressInput.type = 'text';
              addressInput.placeholder = 'Enter Address';
              addressInput.style.width = '300px';
              addressInput.style.marginTop = '5px';
              addressInput.style.marginBottom = '10px';

              let amount = document.createElement('label');
              amount.innerHTML = 'Amount';
              let amountInput = document.createElement('input');
              amountInput.type = 'number';
              amountInput.placeholder = 'Enter Amount';
              amountInput.style.width = '300px';
              amountInput.style.marginTop = '5px';
              amountInput.style.marginBottom = '10px';

              button = document.createElement('button');
              button.innerHTML = 'Submit';
              button.style.width = '100px';

              form.addEventListener('submit', function () {
                console.log(nameInput.value);
                console.log(addressInput.value);
                console.log(amountInput.value);
                div.innerHTML = '';
              });

              form.appendChild(name);
              form.appendChild(nameInput);
              form.appendChild(address);
              form.appendChild(addressInput);
              form.appendChild(amount);
              form.appendChild(amountInput);
              form.appendChild(button);

              div.appendChild(form);
            }
          })
          .catch((error) => {
            console.error('Error loading page:', error);
          });
      }
    </script>
  </body>
</html>
